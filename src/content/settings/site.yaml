about:
  zh: '你好，我是 vlas，一名专注数字产品与品牌的设计师。


    过去 6 年，我和金融、科技、文旅与消费品牌合作，把复杂的问题拆解成清晰、好用、有质感的体验。我相信好的设计不需要解释，它只是让事情变得更顺。


    我可以独立负责从调研、策略到视觉落地的完整流程，也很享受和工程、市场团队一起把产品做出来。'
  en: 'Hi, I’m vlas, a designer working across digital products and brands.


    For six years I have worked with finance, tech, tourism and consumer brands, turning complex problems into clear, usable and well-crafted experiences. Good design shouldn’t need explaining; it should just make things work better.


    I can own the whole process from research and strategy to final visuals, and I enjoy building products alongside engineering and marketing teams.'
