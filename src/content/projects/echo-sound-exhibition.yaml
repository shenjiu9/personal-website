internalName: Echo 声音装置展
status: published
featured: false
order: 6
title:
  zh: Echo 声音装置展
  en: Echo — A Sound Exhibition
summary:
  zh: 一个把城市声音可视化的展览概念，参观者的脚步会在空间里留下光的回声。
  en: >-
    An exhibition concept that visualises city sound: visitors’ footsteps leave
    echoes of light in the room.
client: 个人项目
year: 2023
role:
  zh: 概念、空间与动效设计
  en: Concept, Spatial & Motion Design
services:
  - zh: 展陈设计
    en: Exhibition design
  - zh: 动效设计
    en: Motion design
  - zh: 3D 设计
    en: 3D design
cover: ../../assets/projects/echo-sound-exhibition/cover.jpg
coverPortrait: false
hero: ../../assets/projects/echo-sound-exhibition/hero.jpg
challenge:
  zh: 如何让人"看见"平时被忽略的城市声音？
  en: How do you make people see the city sounds they usually tune out?
solution:
  zh: 用环形光带把声音的频率和强度转译成光，空间随参观者的动作实时变化。
  en: >-
    Rings of light translate frequency and volume into light, and the room
    responds to visitors in real time.
result:
  zh: 获得 2023 年度青年设计双年展概念类银奖。
  en: Silver, concept category, 2023 Young Design Biennale.
