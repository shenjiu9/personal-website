      text:
        zh: 我们在 12 个街区录制了 40 小时的环境声，并把它们分成"人、车、自然"三类频段。
        en: >-
          We recorded 40 hours of ambient sound across 12 blocks and split it
          into three bands: people, traffic, nature.
