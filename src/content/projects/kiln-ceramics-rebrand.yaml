internalName: Kiln 陶作
status: published
featured: true
order: 2
title:
  zh: Kiln 陶作 品牌焕新
  en: Kiln Ceramics Rebrand
summary:
  zh: 为一家独立陶艺工作室打造从标志、包装到线下空间的完整品牌识别。
  en: >-
    A complete identity for an independent ceramics studio, from mark and
    packaging to the retail space.
client: Kiln Studio
year: 2025
role:
  zh: 品牌设计师
  en: Brand Designer
services:
  - zh: 品牌策略
    en: Brand strategy
  - zh: 视觉识别
    en: Visual identity
  - zh: 包装设计
    en: Packaging
  - zh: 空间导视
    en: Wayfinding
cover: ../../assets/projects/kiln-ceramics-rebrand/cover.jpg
coverPortrait: true
hero: ../../assets/projects/kiln-ceramics-rebrand/hero.jpg
challenge:
  zh: 工作室作品很有辨识度，但品牌形象零散，线上线下没有统一的语言，难以进入精品买手店。
  en: >-
    The work was distinctive, but the brand was fragmented across channels,
    which kept it out of boutique retailers.
solution:
  zh: 以"窑口"的半圆为核心图形，延展出一套温暖克制的色彩、字体与包装系统。
  en: >-
    We built the identity around the half-circle of a kiln mouth, extending it
    into a warm, restrained system of colour, type and packaging.
result:
  zh: 新品牌发布后进入 12 家买手店，线上客单价提升 27%。
  en: >-
    After launch the studio entered 12 boutique stores and online order value
    rose 27%.
fields:
  - brand-identity
  - packaging
  - graphic-design
platforms:
  - print
  - physical-space
industries:
  - real-estate-home
projectTypes:
  - commercial
