challenge:
  zh: 货架上同类产品超过 40 个，新品牌需要在 2 米外被认出来。
  en: >-
    More than 40 competitors share the shelf; a new brand had to be recognisable
    from two metres away.
solution:
  zh: 用大面积纯色与一个简单的圆形窗口展示燕麦质感，口味只靠颜色区分，不堆砌信息。
  en: >-
    Large flat colour and a single circular window showing the oat texture;
    flavours differ by colour alone.
result:
  zh: 首批 6 万件两个月售罄，并被 3 家连锁便利店引入。
  en: >-
    The first 60,000 units sold out in two months and three convenience chains
    picked it up.
