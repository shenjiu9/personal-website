  zh: Oat & Co. 燕麦饮包装系列
  en: Oat & Co. Packaging Series
summary:
  zh: 一个植物奶新品牌的包装系统，三种口味用颜色和形状一眼区分。
  en: >-
    A packaging system for a new plant-milk brand where three flavours read
    apart at a glance.
